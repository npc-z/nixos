plugin {
    hyprbars {
        # example config
        bar_height = 30
        bar_text_size = 16
        bar_text_font = ""
        bar_text_align = "left"
        bar_padding = 20
        bar_button_padding = 20

        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(ff4040), 20, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(eeee11), 20, , hyprctl dispatch fullscreen 1
    }
}

windowrule {
    name = no-hyprbars-on-tiled-windows
    hyprbars:no_bar = true

    match:class = ^(zen-twilight|kitty|clash-verge|weixin|wechat|QQ|org.telegram.desktop|Cloud Music|com.gitee.gmg137.NeteaseCloudMusicGtk4)$
}

