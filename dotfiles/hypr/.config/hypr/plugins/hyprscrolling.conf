general {
    # overwrite general.conf
    layout = scrolling
}


plugin:hyprscrolling {
    # if there's only one column, should it be fullscreen
    fullscreen_on_one_column = true
    explicit_column_widths = 0.5, 1.0
}

unbind = $mainMod, space # 解绑 `binds.conf` 中的全屏绑定
bind = $mainMod, space, layoutmsg, colresize +conf

unbind = $mainMod, J
unbind = $mainMod, K
unbind = $mainMod, up
unbind = $mainMod, down
unbind=SUPER, right
unbind=SUPER, left

bind = $mainMod, J, workspace, m+1
bind = $mainMod, K, workspace, m-1

