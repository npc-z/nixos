animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    # animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 5, easeOutExpo, popin
    animation = windowsOut, 1, 5, easeOutExpo, slide
    animation = windowsMove, 1, 5, easeOutExpo, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 3, easeOutExpo, slidevert
    animation = specialWorkspaceIn, 1, 3, easeOutExpo, slidevert
    animation = specialWorkspaceOut, 1, 3, easeOutExpo, slidevert
}


