# windowrule

windowrule = animation popin, match:class .*

# 使用体验，对认证程序采用浮动窗口
windowrule = float on, match:class ^(.*polkit.*)$
# windowrule = float, class:^(foot)$

# 选择分享窗口
windowrule = float on, match:title ^(.*Select what to share.*)$

windowrule = float on, match:title ^.*(Media viewer).*$
windowrule = float on, match:class ^.*(clash-verge).*$
windowrule = float on, match:title ^.*(Bluetooth Devices).*$

windowrule = float on, match:title ^.*(Picture-in-Picture).*$

windowrule = float on, size (monitor_w*0.7) (monitor_h*0.5), opacity 0.50, match:class ^(Alacritty)$

windowrule = workspace 1, match:class ^(Code|code)$
# windowrule = opacity 0.9, match:class ^(kitty)$

windowrule = workspace 3, match:class ^(Microsoft-edge)$
windowrule = workspace 3, match:class ^(firefox)$
windowrule = workspace 3, match:class ^(zen-twilight)$
windowrule = focus_on_activate on, match:class ^(firefox|Microsoft-edge|Google-chrome|Chromium|zen-twilight)$

windowrule = workspace 4, match:class ^(org.pwmt.zathura)$
windowrule = workspace 4, match:class ^.*(okular).*$

windowrule = workspace 5, float on, match:class ^(weixin)$

windowrule = workspace 5, float on, match:class ^(wechat)$

windowrule = workspace 5, float on, match:class ^(QQ)$

windowrule = workspace 5, float on, match:class ^(org.telegram.desktop)$

windowrule = workspace 5, match:class ^(Bytedance-feishu)$


windowrule = float on, workspace 6, match:class ^(electron-netease-cloud-music)$

windowrule = float on, workspace 6, match:class ^(netease-cloud-music)$
windowrule = float on, pin on, match:title ^(Cloud Music)$

windowrule = float on, workspace 6, match:class ^(com.gitee.gmg137.NeteaseCloudMusicGtk4)$

windowrule = workspace 7, match:class ^(nemo)$
windowrule = workspace 7, match:class ^(spacedrive)$
windowrule = workspace 7, match:class ^.*(Nautilus).*$

windowrule = workspace 10, float on, match:class ^(steam)$
windowrule = workspace 10, float on, match:title ^(AntiMicroX)$

workspace = 2, on-created-empty:kitty, default:true

